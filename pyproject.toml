[project]
name = "day-in-our-data-showcase"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["anthropic>=1.0.0", "pydantic>=2.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
# Optional browser, accessibility and load suites (tests/e2e, tests/load).
e2e = ["pytest>=8.0", "pytest-playwright>=0.5", "axe-playwright-python>=0.1.4", "locust>=2.20"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools]
packages = ["judging", "voting"]
