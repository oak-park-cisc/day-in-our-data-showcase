title = "From idea to demo: the workflow"
nav_label = "Workflow"
lede = "AI makes writing code fast. What still takes judgment is deciding what to build, checking that it is right, and keeping track of what you learned. This is a loop you can run several times in one afternoon."
description = "A brainstorm, plan, architecture, build, and QA workflow for AI-assisted prototyping, mapped to Compound Engineering and the Day in Our Data schedule."

[[sections]]
id = "loop"
heading = "The loop"
intro = "Five stages. Humans own the decisions; Claude does most of the typing. The last stage feeds the first: each loop starts smarter than the one before. The commands in each box come from the [Compound Engineering plugin](/toolbox.html#plugins)."

  [[sections.blocks]]
  type = "flow"
  label = "Brainstorm, plan, architecture, build, and QA, looping back through compound"
  loop_label = "↺ **Compound:** write down what worked and what broke (`/ce-compound`), then start the next loop."

    [[sections.blocks.stages]]
    name = "Brainstorm"
    who = "Whole team · Claude asks questions"
    does = "Agree on the civic question, who it is for, and what a good result at 2:30 looks like."
    output = "A one-paragraph problem statement."
    command = "/ce-brainstorm"

    [[sections.blocks.stages]]
    name = "Plan"
    who = "Claude drafts · team edits"
    does = "Break the goal into small steps. Decide what to skip if time runs short."
    output = "A numbered plan with a must-have demo."
    command = "/ce-plan"

    [[sections.blocks.stages]]
    name = "Architecture"
    who = "Claude proposes · team decides"
    does = "Pick the data files, the tools (a map? a chart? a page?), and where it will live."
    output = "A sketch: data → cleaning → output."
    command = "plan mode (Shift+Tab)"

    [[sections.blocks.stages]]
    name = "Build"
    who = "Claude types · one person drives"
    does = "Work one step at a time. Open the result after every step. Commit when something works."
    output = "Working code, committed."
    command = "/ce-work"

    [[sections.blocks.stages]]
    name = "QA"
    who = "Everyone · plus automated tests"
    does = "Check the numbers against the raw data, try it on a phone, run the tests, get a review."
    output = "Tests passing and a list of known gaps."
    command = "/ce-code-review"

