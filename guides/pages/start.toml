title = "Get started"
nav_label = "Start"
lede = "Two ways to take part. Pick a track, get set up in about 15 minutes, and spend the rest of the day on Oak Park's data. AI tools are welcome, and so is a project that uses none."
description = "Start here for Day in Our Data: pick Track A (the Civic Spark browser workspace, zero setup, no GitHub needed) or Track B (your own tools), write your README, and enter your project."

[[sections]]
id = "before"
heading = "Before you arrive"
intro = "None of this is required. Each item saves you ten minutes at your table."

  [[sections.blocks]]
  type = "checklist"
  items = [
    "Charge your laptop and bring the charger. A tablet works for the browser workspace, but a keyboard helps.",
    "Skim the [15 starter projects]({event.starter_projects}) and pick two you would enjoy.",
    "**Track B only:** make a free [GitHub account](https://github.com/signup) and, if you like, install Claude Code (below) at home, where the Wi-Fi is not shared with 40 other people. Track A needs neither.",
  ]

  [[sections.blocks]]
  type = "callout"
  tone = "event"
  title = "Free credits for today"
  body = "{event.anthropic_credits}"

  [[sections.blocks]]
  type = "callout"
  tone = "tip"
  title = "No AI required"
  body = "Traditional projects are fully welcome: a chart made in a spreadsheet, a deterministic Python or R script, a plain web page, a cleaned dataset, a printed map. The judges score every entry on the same terms, and using AI earns no extra points."

[[sections]]
id = "tracks"
heading = "Pick your track"
intro = "Both tracks end in the same place: an entry on this site. They differ in how much you set up. If you are not sure, take Track A."

  [[sections.blocks]]
  type = "cards"

    [[sections.blocks.items]]
    tag = "Track A · Zero setup · Recommended"
    title = "The {event.workspace_name} browser workspace"
    body = "A ready-made coding environment built for this event. It runs in your browser, the starter projects are already loaded, and you cannot break anything. **No GitHub account needed:** download your project as a zip and attach it to your entry."
    link = "#track-a"
    link_label = "Set up Track A"

    [[sections.blocks.items]]
    tag = "Track B · Your own tools"
    title = "Your laptop, your editor, your workflow"
    body = "Claude Code in your terminal or editor, Claude Code on the web, Python or Jupyter, or plain Git with no AI at all. Your work lives in a GitHub repository you link from your entry."
    link = "#track-b"
    link_label = "Set up Track B"

[[sections]]
id = "track-a"
heading = "Track A: the {event.workspace_name} workspace"

  [[sections.blocks]]
  type = "steps"

    [[sections.blocks.items]]
    title = "Open the workspace and sign in"
    body = "Go to [{event.workspace_url}]({event.workspace_url}) and create an account with any email address you can check."

    [[sections.blocks.items]]
    title = "Enter your key before you start a session"
    body = "Open the **Agent** tab and paste your key **first**. If you start a session before entering a key, the agent has nothing to run on. {event.glm_key}"
    note = "For GLM, paste the event key. For Claude, paste your own Claude token and pick **Opus** as the model."

    [[sections.blocks.items]]
    title = "Say hello to the agent"
    body = "Type a plain-English request in the Agent tab. Try: *List the starter projects in this workspace and tell me which one a beginner could finish in two hours.*"

    [[sections.blocks.items]]
    title = "Optional: use the terminal instead"
    body = "Prefer typing commands? In the **Terminal** tab, run `opencode` for the GLM agent, or `claude` for Claude Code after you have entered your Claude token."
    code = """
opencode     # GLM agent in the terminal
claude       # Claude Code in the terminal
"""

    [[sections.blocks.items]]
    title = "Save your work as a zip"
    body = "Before you leave, and before you enter your project, download your project from the workspace as a zip. That zip is your copy: it is what you attach to your entry, and it outlasts the workspace. Can't find the download option? Ask a table host."

    [[sections.blocks.items]]
    title = "Optional: share a preview link"
    body = "If you built a web page, the workspace can show you a preview link. Open it in a private browser window first: if it loads without signing in, paste it into your entry as your demo link."
    note = "A preview link only works while your workspace is running. Voters open links after building ends, so the zip is what counts. A screenshot in the zip helps too."

  [[sections.blocks]]
  type = "callout"
  tone = "tip"
  title = "You cannot break it"
  body = "The workspace is disposable by design. Try things, ask the agent to undo things, start over. If something looks wrong, a table host can reset it."

[[sections]]
id = "track-b"
heading = "Track B: your own tools"
intro = "Track B assumes a free [GitHub account](https://github.com/signup): your repository is how teammates share work and how you link it from your entry. Pick whichever tool below suits you."

  [[sections.blocks]]
  type = "callout"
  tone = "warn"
  title = "Working as a team? Share a repository, not a chat"
  body = "Pasting code back and forth into a Claude chat breaks down once a project has more than one file or more than one person: the chat cannot see your files, and every teammate ends up with a different copy. Put the project in one GitHub repository and have each person run Claude Code on their own clone (terminal, editor, or [claude.ai/code](https://claude.ai/code)), committing and pulling as you go."

  [[sections.blocks]]
  type = "cards"

    [[sections.blocks.items]]
    tag = "Most control"
    title = "Claude Code in your terminal or editor"
    body = "Runs on your own files. Install steps are below. Works inside VS Code, Cursor, and JetBrains IDEs too: see [where to code](/where-to-code.html)."
    link = "#install"
    link_label = "Install Claude Code"

    [[sections.blocks.items]]
    tag = "No install"
    title = "Claude Code on the web or desktop"
    body = "Use [claude.ai/code](https://claude.ai/code) in the browser, or the Code tab of the [Claude desktop app](https://claude.com/download). Needs a Pro, Max, Team, Enterprise, or Console account; the event credits apply to a Console account. Connect GitHub when asked and pick your team's repository."

    [[sections.blocks.items]]
    tag = "Your usual stack"
    title = "Python, Jupyter, R, or no AI at all"
    body = "Clone or download the [event repository]({event.event_repo}) for the starter projects and cached data, and work however you normally do. Commit to your team repository as you go."

[[sections]]
id = "install"
heading = "Track B: install Claude Code on your laptop"
intro = "Claude Code runs on macOS 13+, Windows 10 (1809) or later, and most Linux distributions, with 4 GB of memory or more. You do not need administrator rights."

  [[sections.blocks]]
  type = "steps"

    [[sections.blocks.items]]
    title = "Open a terminal"
    body = "**Mac:** press Cmd+Space, type *Terminal*, press Enter. **Windows:** press the Windows key, type *PowerShell*, press Enter. **Linux:** you know where it is."

    [[sections.blocks.items]]
    title = "Run the installer for your system"
    body = "Copy the one line for your system, paste it into the terminal, press Enter."
    code = """
# macOS, Linux, or WSL
curl -fsSL https://claude.ai/install.sh | bash

# Windows PowerShell
irm https://claude.ai/install.ps1 | iex

# Or with a package manager
brew install --cask claude-code        # macOS Homebrew
winget install Anthropic.ClaudeCode    # Windows
"""
    note = "Windows: installing [Git for Windows](https://git-scm.com/downloads/win) is optional but lets Claude Code use Git Bash. If you see `'irm' is not recognized`, you are in CMD, not PowerShell."

    [[sections.blocks.items]]
    title = "Check it worked"
    body = "Close the terminal, open a new one, and run the version check. If it says `claude` is not found, open a fresh terminal once more, then ask a table host."
    code = """
claude --version     # prints a version number
claude doctor        # checks your install and settings
"""

    [[sections.blocks.items]]
    title = "Get the event data and start Claude"
    body = "Download the event repository, move into it, and start Claude Code. The first run opens your browser to sign in."
    code = """
{event.event_repo_clone}
cd Oak_Park_Day_in_our_Data
claude
"""
    note = "No `git`? Download the repository as a ZIP from GitHub (green **Code** button, then **Download ZIP**), unzip it, and `cd` into the folder."

    [[sections.blocks.items]]
    title = "Optional: use it inside your editor"
    body = "Install the Claude Code extension for VS Code (it also works in Cursor), or the plugin for JetBrains IDEs. See [where to code](/where-to-code.html) for the trade-offs."

[[sections]]
id = "first-15"
heading = "Your first 15 minutes"
intro = "Same steps on both tracks, whichever agent you use. Type these in plain English. You do not need to know any code."

  [[sections.blocks]]
  type = "steps"

    [[sections.blocks.items]]
    title = "Let it read the project"
    body = "Run `/init`. Claude reads the files and writes a `CLAUDE.md`: notes it will reread at the start of every session."

    [[sections.blocks.items]]
    title = "Ask for a tour"
    body = "*Explain what is in this project like I have never coded before. What data is here and what could I make with it?*"

    [[sections.blocks.items]]
    title = "Plan before you build"
    body = "Press **Shift+Tab** until the mode shows **plan**. Claude now researches and proposes a plan without changing any files. Say *Plan a simple map for starter project 11 (the urban forest).* Read the plan, push back, then switch out of plan mode and say *Go.*"

    [[sections.blocks.items]]
    title = "See it running"
    body = "*Show me how to open what you just built.* Claude will give you a command, a file to open, or a link."

    [[sections.blocks.items]]
    title = "Keep your data steps in files"
    body = "*Put every step that changes the data in a script or notebook, not just in this chat, and tell me which file does what.* A result nobody can rerun is hard to trust, and the judges check for it."

  [[sections.blocks]]
  type = "callout"
  tone = "tip"
  title = "Stuck? Say so"
  body = "Paste the error message and ask *What does this mean and how do I fix it?* Press **Esc** to stop Claude mid-task. Press **Esc** twice to rewind to an earlier point."

[[sections]]
id = "readme"
heading = "Write your README"
intro = "Start this by 2:00. Your README is how the AI judging panel understands your project: it reads your entry and your README, not your code or your app. Use these five headings, one short paragraph each."

  [[sections.blocks]]
  type = "table"
  caption = "The five README headings and what each one answers"
  headers = ["Heading", "What to write"]
  rows = [
    ["The question", "What resident question does this answer, and who asks it?"],
    ["The data", "Which datasets you used, where they came from, and what they do not cover."],
    ["How we got the numbers", "Each step from the raw file to your result: filtered, joined, counted, charted. Say which script or spreadsheet does it, and where AI helped."],
    ["How to use it", "How to open it or read it, in plain words."],
    ["Status and next steps", "What works, what does not yet, and what someone should do on Monday."],
  ]

  [[sections.blocks]]
  type = "code"
  caption = "Paste this to your agent"
  code = """
Write README.md for this project using exactly these five headings:
The question, The data, How we got the numbers, How to use it,
Status and next steps. Only describe what is really in these files.
List every data file we used and every step that changes the numbers.
Keep it under one page.
"""

  [[sections.blocks]]
  type = "checklist"
  items = [
    "**Track A:** the workspace starts you with a placeholder `README.md`. Replace it; the placeholder counts as no README. It then travels inside your zip.",
    "**Track B:** put `README.md` at the top level of your repository.",
    "**No code, no agent?** Write the five headings by hand in a document and upload it with your entry.",
    "Read it before you submit. Delete anything that is not true: the judges can only score what the README says.",
    "No README at all is fine. The panel then scores your written entry alone.",
  ]

[[sections]]
id = "enter"
heading = "Enter your project"
intro = "Every team enters on this site, once, using the [entry form](/#submit). Nothing else to fill in anywhere."

  [[sections.blocks]]
  type = "table"
  caption = "What each track puts in the entry form"
  headers = ["Field", "Track A (workspace)", "Track B (your own tools)"]
  rows = [
    ["Written answers", "Required", "Required"],
    ["How you got from the raw data to the result", "Required: a few plain sentences", "Required: a few plain sentences"],
    ["Repository link", "Leave blank", "Your GitHub repository"],
    ["Live demo link", "Optional: your preview link, if it opens signed out", "Optional: anywhere public"],
    ["Upload", "Your project zip (up to 8 MB)", "Optional: a chart, CSV, PDF, or zip"],
  ]

[[sections]]
id = "rules"
heading = "Ground rules for AI tools today"

  [[sections.blocks]]
  type = "checklist"
  items = [
    "**Keys and tokens are passwords.** Never paste one into a file you commit, a public chat, a screenshot, or your showcase entry. If one leaks, tell a table host so it can be revoked.",
    "**Public data only.** Do not give the AI confidential or personal information.",
    "**Check what the AI tells you.** Open the chart, read the numbers, ask *How do you know that?* Label prototypes as prototypes.",
    "**Never let the AI make up data.** Numbers should come from a data file through a step you can rerun, not typed in by a model.",
    "**Record your sources.** The README's *The data* heading is where they go.",
    "**Nothing made today is an official Village product or position.**",
  ]
